<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', Georgia, serif;
        }
        html,
        body.bg-white {
            background-color: #fff;
        }
        .site-nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            padding: 1rem 0;
            background-color: #fff;
            isolation: isolate;
        }
        .nav-inner {
            display: flex;
            width: 90vw;
            max-width: none;
            margin-left: 5vw;
            margin-right: 5vw;
            align-items: stretch;
            flex-direction: column;
            gap: 1rem;
        }
        .about-container {
            width: 100%;
        }
        .about-container a {
            overflow-wrap: anywhere;
        }
        .about-container img {
            display: block;
            width: 50%;
            margin: 0;
            cursor: pointer;
        }
        .about-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .about-lightbox.active {
            display: flex;
            opacity: 1;
        }
        .about-lightbox img {
            width: auto;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            cursor: auto;
        }
        .page-content {
            width: 90vw;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        .nav-title {
            display: block;
            width: 100%;
            color: inherit;
            font-size: 1.25rem;
            line-height: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            text-align: left;
        }
        .nav-links {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            font-size: 0.75rem;
            line-height: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-about {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            gap: 0.75rem 1rem;
            font-size: 0.75rem;
            line-height: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-links a,
        .nav-about a {
            text-decoration: none;
        }
        @media (min-width: 768px) {
            .nav-inner,
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
        }
    </style>
</head>
<body class="bg-white text-black">
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-title">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html" class="hover:text-gray-300 transition">Cyanotypes</a>
                <a href="fashion.html" class="hover:text-gray-300 transition">Fashion</a>
                <a href="portraits.html" class="hover:text-gray-300 transition">Portraits</a>
                <a href="spaces.html" class="hover:text-gray-300 transition">Spaces</a>
            </div>
            <div class="nav-about"><a href="about.html" class="hover:text-gray-300 transition">About</a></div>
        </div>
    </nav>

    <!-- About Content -->
    <div class="page-content min-h-screen">
        <div class="about-container">
            <div class="space-y-6">
                <div class="space-y-6 text-lg leading-relaxed">
                    <p>
                        Digital and film photography, cyanotypes and darkroom printing.
                    </p>
                    <p>
                        <a href="mailto:albertorafael.colombopastran@gmail.com">albertorafael.colombopastran@gmail.com</a><br>
                        Instagram: <a href="https://www.instagram.com/neu.port/" target="_blank" rel="noopener noreferrer">@neu.port</a>
                    </p>
                </div>
                <img 
                    src="img/about.webp" 
                    alt="Portrait" 
                    class="w-full h-auto object-cover"
                    role="button"
                    tabindex="0"
                    aria-label="Expand portrait"
                >
            </div>
        </div>
    </div>

    <div class="about-lightbox" id="about-lightbox" role="dialog" aria-modal="true" aria-label="Expanded portrait">
        <img src="img/about.webp" alt="Portrait">
    </div>

    <!-- Footer -->
    <footer class="py-8 text-center text-sm text-gray-500">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
    <script>
        const aboutImage = document.querySelector('.about-container img');
        const aboutLightbox = document.getElementById('about-lightbox');

        function openAboutLightbox() {
            aboutLightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeAboutLightbox() {
            aboutLightbox.classList.remove('active');
            document.body.style.overflow = '';
            aboutImage.focus();
        }

        aboutImage.addEventListener('click', openAboutLightbox);
        aboutImage.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                openAboutLightbox();
            }
        });
        aboutLightbox.addEventListener('click', (event) => {
            closeAboutLightbox();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && aboutLightbox.classList.contains('active')) {
                closeAboutLightbox();
            }
        });
    </script>
</body>
</html>
