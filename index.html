<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCP</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            font-family: 'Playfair Display', Georgia, serif;
            background: white;
            color: black;
        }
        html,
        body.bg-white {
            background-color: #fff;
        }
        .site-nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            padding: 1rem 0;
            background-color: #fff;
            isolation: isolate;
        }
        .nav-inner {
            display: flex;
            width: 90vw;
            margin: 0 auto;
            align-items: stretch;
            flex-direction: column;
            gap: 1rem;
        }
        .nav-links {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            font-size: 0.75rem;
            line-height: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-about {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            font-size: 0.75rem;
            line-height: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .brand {
            display: block;
            width: 100%;
            color: inherit;
            font-size: 1.25rem;
            line-height: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            text-align: left;
        }
        .nav-links a,
        .nav-about a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease-in-out;
        }
        .nav-links a:hover,
        .nav-about a:hover {
            color: #d1d5db;
        }
        .cover {
            display: flex;
            width: 100%;
            height: 100vh;
            align-items: center;
            justify-content: center;
            background: white;
        }
        .site-footer {
            display: flex;
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            height: 3rem;
            align-items: center;
            justify-content: center;
            padding: 0 0.5rem;
            color: #6b7280;
            font-size: clamp(0.65rem, 2.4vw, 0.875rem);
            text-align: center;
        }
        .site-footer p {
            margin: 0;
        }
        .cover-image {
            width: 90%;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
        }
        @media (min-width: 768px) {
            .nav-inner {
                width: 50vw;
            }
            .cover-image {
                width: 50%;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html">Cyanotypes</a>
                <a href="fashion.html">Fashion</a>
                <a href="portraits.html">Portraits</a>
                <a href="spaces.html">Spaces</a>
            </div>
            <div class="nav-about"><a href="about.html">About</a></div>
        </div>
    </nav>

    <!-- Cover Image -->
    <div class="cover">
        <img 
            src="img/index.webp" 
            alt="Cover" 
            class="cover-image"
            draggable="false"
        >
    </div>
    <footer class="site-footer">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
