<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaces | A R C P</title>
    <link rel="preload" href="fonts/eb-garamond-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        .gallery-container {
            width: 100%;
        }
        .page-content {
            width: 90vw;
            min-height: 100vh;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        @media (min-width: 768px) {
            .nav-inner,
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
            .nav-inner {
                grid-template-areas:
                    "title title"
                    "links links";
            }
            .nav-links .nav-about-link {
                flex-basis: auto;
                margin-left: 0;
            }
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f8f7;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .gallery-column {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 1rem;
        }
        .gallery-column[hidden] {
            display: none;
        }
        .gallery-item {
            cursor: pointer;
            background-color: #f8f8f7;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #f8f8f7;
        }
    </style>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html">Cyanotypes</a>
                <a href="fashion.html">Fashion</a>
                <a href="portraits.html">Portraits</a>
                <a href="spaces.html" aria-current="page">Spaces</a>
                <a href="about.html" class="nav-about-link">About</a>
            </div>
        </div>
    </nav>

    <!-- Gallery -->
    <div class="page-content">
        <div class="gallery-container">
            <div class="gallery-grid">
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const images = [
            { src: 'img/spaces/space-13.webp', width: 1080, height: 1080 },
            { src: 'img/spaces/space-12.webp', width: 1080, height: 1620 },
            { src: 'img/spaces/space-11.webp', width: 1620, height: 1080 },
            { src: 'img/spaces/space-10.webp', width: 1080, height: 1080 },
            { src: 'img/spaces/space-9.webp', width: 2160, height: 2160 },
            { src: 'img/spaces/space-8.webp', width: 1080, height: 1080 },
            { src: 'img/spaces/space-7.webp', width: 1620, height: 1080 },
            { src: 'img/spaces/space-6.webp', width: 1080, height: 1620 },
            { src: 'img/spaces/space-5.webp', width: 1080, height: 1080 },
            { src: 'img/spaces/space-4.webp', width: 1620, height: 1080 },
            { src: 'img/spaces/space-3.webp', width: 1200, height: 960 },
            { src: 'img/spaces/space-2.webp', width: 1080, height: 1495 },
            { src: 'img/spaces/space-1.webp', width: 1080, height: 1080 }
        ];
        const getImageNumber = ({ src }) => Number(src.match(/spaces?-(\d+)/)?.[1] ?? 0);
        images.sort((a, b) => getImageNumber(b) - getImageNumber(a));

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const galleryGrid = document.querySelector('.gallery-grid');
        let currentIndex = 0;

        images.forEach((image, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.addEventListener('click', () => openLightbox(index));

            const thumbnail = document.createElement('img');
            thumbnail.src = image.src;
            thumbnail.width = image.width;
            thumbnail.height = image.height;
            thumbnail.alt = `Space ${getImageNumber(image)}`;
            thumbnail.loading = 'lazy';
            item.append(thumbnail);

            galleryGrid.append(item);
        });

        const galleryItems = [...galleryGrid.querySelectorAll('.gallery-item')];
        const galleryColumns = Array.from({ length: 3 }, () => {
            const column = document.createElement('div');
            column.className = 'gallery-column';
            return column;
        });
        galleryGrid.replaceChildren(...galleryColumns);

        function layoutGalleryColumns() {
            const columnCount = window.matchMedia('(min-width: 768px)').matches ? 3 : 2;
            const columnGap = parseFloat(getComputedStyle(galleryGrid).columnGap) || 0;
            const rowGap = parseFloat(getComputedStyle(galleryColumns[0]).rowGap) || 0;
            const columnWidth = (galleryGrid.clientWidth - columnGap * (columnCount - 1)) / columnCount;
            galleryColumns.forEach((column, index) => {
                column.hidden = index >= columnCount;
                column.replaceChildren();
            });

            const itemsByHeight = galleryItems.map((item, index) => {
                const image = item.querySelector('img');
                const width = image.naturalWidth || image.width;
                const height = image.naturalHeight || image.height;
                return { item, index, height: columnWidth * height / width };
            }).sort((a, b) => b.height - a.height || a.index - b.index);
            const columnHeights = Array(columnCount).fill(0);
            const columnItems = Array.from({ length: columnCount }, () => []);

            itemsByHeight.forEach((entry) => {
                const columnIndex = columnHeights.indexOf(Math.min(...columnHeights));
                if (columnItems[columnIndex].length > 0) columnHeights[columnIndex] += rowGap;
                columnHeights[columnIndex] += entry.height;
                columnItems[columnIndex].push(entry);
            });

            const getColumnHeights = () => columnItems.map((items) =>
                items.reduce((height, entry) => height + entry.height, 0)
                    + Math.max(0, items.length - 1) * rowGap
            );
            let bestSwap;
            do {
                bestSwap = null;
                let bestSpread = Math.max(...getColumnHeights()) - Math.min(...getColumnHeights());

                for (let firstColumn = 0; firstColumn < columnCount; firstColumn++) {
                    for (let secondColumn = firstColumn + 1; secondColumn < columnCount; secondColumn++) {
                        for (let firstIndex = 0; firstIndex < columnItems[firstColumn].length; firstIndex++) {
                            for (let secondIndex = 0; secondIndex < columnItems[secondColumn].length; secondIndex++) {
                                [columnItems[firstColumn][firstIndex], columnItems[secondColumn][secondIndex]] =
                                    [columnItems[secondColumn][secondIndex], columnItems[firstColumn][firstIndex]];
                                const heights = getColumnHeights();
                                const spread = Math.max(...heights) - Math.min(...heights);
                                [columnItems[firstColumn][firstIndex], columnItems[secondColumn][secondIndex]] =
                                    [columnItems[secondColumn][secondIndex], columnItems[firstColumn][firstIndex]];

                                if (spread < bestSpread) {
                                    bestSpread = spread;
                                    bestSwap = { firstColumn, secondColumn, firstIndex, secondIndex };
                                }
                            }
                        }
                    }
                }

                if (bestSwap) {
                    const { firstColumn, secondColumn, firstIndex, secondIndex } = bestSwap;
                    [columnItems[firstColumn][firstIndex], columnItems[secondColumn][secondIndex]] =
                        [columnItems[secondColumn][secondIndex], columnItems[firstColumn][firstIndex]];
                }
            } while (bestSwap);

            columnItems.forEach((items, index) => {
                items.sort((a, b) => a.index - b.index);
                items.forEach(({ item }) => galleryColumns[index].append(item));
            });
        }

        galleryItems.forEach((item) => {
            item.querySelector('img').addEventListener('load', layoutGalleryColumns);
        });
        window.addEventListener('resize', layoutGalleryColumns);
        window.matchMedia('(min-width: 768px)').addEventListener('change', layoutGalleryColumns);
        layoutGalleryColumns();

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex].src;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            lightboxImg.src = images[currentIndex].src;
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Close on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightboxImg) {
                const bounds = lightboxImg.getBoundingClientRect();
                const position = (e.clientX - bounds.left) / bounds.width;

                if (position < 1 / 3) {
                    navigateLightbox(-1);
                } else if (position > 2 / 3) {
                    navigateLightbox(1);
                } else {
                    closeLightbox();
                }
            } else if (e.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
    <footer class="site-footer">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
