<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaces | A R C P</title>
    <link rel="preload" href="fonts/eb-garamond-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'EB Garamond';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('fonts/eb-garamond-latin-ext-400.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'EB Garamond';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('fonts/eb-garamond-latin-400.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        * {
            box-sizing: border-box;
        }
        html {
            scrollbar-gutter: stable;
            overscroll-behavior-y: none;
        }
        body {
            margin: 0;
            overscroll-behavior-y: none;
            font-family: 'EB Garamond', serif;
            background: #f8f8f7;
            color: black;
        }
        a {
            color: #456b88;
        }
        a:hover {
            color: #36566d;
        }
        html {
            background-color: #f8f8f7;
        }
        .site-nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            padding: 1rem 0;
            background-color: #f8f8f7;
            isolation: isolate;
        }
        .nav-inner {
            display: grid;
            width: 90vw;
            margin: 0 auto;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
                "title title"
                "links links";
            gap: 1rem;
        }
        .brand {
            display: block;
            grid-area: title;
            width: auto;
            color: #456b88;
            font-size: 1.25rem;
            line-height: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            text-align: left;
        }
        .nav-links {
            display: flex;
            grid-area: links;
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            letter-spacing: 0.1em;
            font-weight: 400;
        }
        .nav-links a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease-in-out;
        }
        .nav-links a[aria-current="page"] {
            text-decoration: underline;
        }
        .nav-links .nav-about-link {
            flex-basis: 100%;
            margin-left: 0;
            color: #a86464;
            text-align: left;
        }
        .brand:hover {
            color: #36566d;
        }
        .nav-links a:hover {
            color: #d1d5db;
        }
        .nav-links .nav-about-link:hover {
            color: #884747;
        }
        .site-footer {
            display: flex;
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            height: auto;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 0.5rem;
            background-color: #f8f8f7;
            color: #888888;
            font-size: 0.75rem;
            text-align: center;
        }
        .site-footer p {
            margin: 0;
        }
        .gallery-container {
            width: 100%;
        }
        .page-content {
            width: 90vw;
            min-height: 100vh;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        @media (min-width: 768px) {
            .nav-inner,
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
            .nav-inner {
                grid-template-areas:
                    "title title"
                    "links links";
            }
            .nav-links .nav-about-link {
                flex-basis: auto;
                margin-left: 0;
            }
        }
        @media (min-width: 900px) {
            .nav-inner {
                width: 90vw;
                margin-left: auto;
                margin-right: auto;
                grid-template-areas: "title links";
                align-items: center;
            }
            .nav-links {
                width: auto;
                justify-content: flex-end;
                flex-wrap: nowrap;
            }
            .nav-links .nav-about-link {
                flex-basis: auto;
            }
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f8f7;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .gallery-column {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 1rem;
        }
        .gallery-column[hidden] {
            display: none;
        }
        .gallery-item {
            cursor: pointer;
            background-color: #f8f8f7;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #f8f8f7;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html">Cyanotypes</a>
                <a href="fashion.html">Fashion</a>
                <a href="portraits.html">Portraits</a>
                <a href="spaces.html" aria-current="page">Spaces</a>
                <a href="about.html" class="nav-about-link">About</a>
            </div>
        </div>
    </nav>

    <!-- Gallery -->
    <div class="page-content">
        <div class="gallery-container">
            <div class="gallery-grid">
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const images = [
            'img/spaces/space-13.webp',
            'img/spaces/space-12.webp',
            'img/spaces/space-11.webp',
            'img/spaces/space-10.webp',
            'img/spaces/space-9.webp',
            'img/spaces/space-8.webp',
            'img/spaces/space-7.webp',
            'img/spaces/space-6.webp',
            'img/spaces/space-5.webp',
            'img/spaces/space-4.webp',
            'img/spaces/space-3.webp',
            'img/spaces/space-2.webp',
            'img/spaces/space-1.webp'
        ];
        const getImageNumber = (src) => Number(src.match(/spaces?-(\d+)/)?.[1] ?? 0);
        images.sort((a, b) => getImageNumber(b) - getImageNumber(a));

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const galleryGrid = document.querySelector('.gallery-grid');
        let currentIndex = 0;

        images.forEach((src, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.addEventListener('click', () => openLightbox(index));

            const thumbnail = document.createElement('img');
            thumbnail.src = src;
            thumbnail.alt = `Space ${getImageNumber(src)}`;
            thumbnail.loading = 'lazy';
            item.append(thumbnail);

            galleryGrid.append(item);
        });

        const galleryItems = [...galleryGrid.querySelectorAll('.gallery-item')];
        const galleryColumns = Array.from({ length: 3 }, () => {
            const column = document.createElement('div');
            column.className = 'gallery-column';
            return column;
        });
        galleryGrid.replaceChildren(...galleryColumns);

        function layoutGalleryColumns() {
            const columnCount = window.matchMedia('(min-width: 768px)').matches ? 3 : 2;
            const columnGap = parseFloat(getComputedStyle(galleryGrid).columnGap) || 0;
            const rowGap = parseFloat(getComputedStyle(galleryColumns[0]).rowGap) || 0;
            const columnWidth = (galleryGrid.clientWidth - columnGap * (columnCount - 1)) / columnCount;
            const columnHeights = Array(columnCount).fill(0);
            const columnItems = Array(columnCount).fill(0);

            galleryColumns.forEach((column, index) => {
                column.hidden = index >= columnCount;
                column.replaceChildren();
            });

            galleryItems.forEach((item) => {
                const image = item.querySelector('img');
                const columnIndex = columnHeights.indexOf(Math.min(...columnHeights));
                const aspectRatio = image.naturalWidth && image.naturalHeight
                    ? image.naturalHeight / image.naturalWidth
                    : 1;

                if (columnItems[columnIndex] > 0) columnHeights[columnIndex] += rowGap;
                galleryColumns[columnIndex].append(item);
                columnHeights[columnIndex] += columnWidth * aspectRatio;
                columnItems[columnIndex] += 1;
            });
        }

        galleryItems.forEach((item) => {
            item.querySelector('img').addEventListener('load', layoutGalleryColumns);
        });
        window.addEventListener('resize', layoutGalleryColumns);
        window.matchMedia('(min-width: 768px)').addEventListener('change', layoutGalleryColumns);
        layoutGalleryColumns();

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            lightboxImg.src = images[currentIndex];
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Close on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightboxImg) {
                const bounds = lightboxImg.getBoundingClientRect();
                const position = (e.clientX - bounds.left) / bounds.width;

                if (position < 1 / 3) {
                    navigateLightbox(-1);
                } else if (position > 2 / 3) {
                    navigateLightbox(1);
                } else {
                    closeLightbox();
                }
            } else if (e.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
    <footer class="site-footer">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
