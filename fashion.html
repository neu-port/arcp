<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion | arcp</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .gallery-container {
            width: 100%;
        }
        .page-content {
            width: 90vw;
            min-height: 100vh;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        @media (min-width: 768px) {
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
        }
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f8f7;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }
        .gallery-category + .gallery-category {
            margin-top: 2rem;
        }
        .gallery-category-header {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            letter-spacing: 0.1em;
            font-weight: 400;
        }
        .gallery-category h2 {
            margin: 0;
            font: inherit;
        }
        .gallery-category-header a {
            text-decoration: none;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .gallery-column {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 1rem;
        }
        .gallery-item {
            cursor: pointer;
            background-color: #f8f8f7;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #f8f8f7;
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html">Cyanotypes</a>
                <a href="fashion.html" aria-current="page">Fashion</a>
                <a href="portraits.html">Portraits</a>
                <a href="spaces.html">Spaces</a>
                <a href="about.html" class="nav-about-link">About</a>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="gallery-container">
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const categories = {
            ALT: ['alt-1.webp', 'alt-2.webp', 'alt-3.webp'],
            CH: ['ch-1.webp', 'ch-2.webp', 'ch-3.webp'],
            PS: ['ps-1.webp', 'ps-2.webp', 'ps-3.webp', 'ps-4.webp', 'ps-5.webp', 'ps-6.webp'],
            TQ: ['tq-a.webp', 'tq-b.webp', 'tq-c.webp', 'tq-1.webp', 'tq-2.webp', 'tq-3.webp', 'tq-4.webp', 'tq-5.webp', 'tq-6.webp']
        };
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const galleryGrids = [];
        let currentImages = [];
        let currentIndex = 0;

        Object.entries(categories).forEach(([name, files]) => {
            const section = document.createElement('section');
            section.className = 'gallery-category';

            const header = document.createElement('div');
            header.className = 'gallery-category-header';

            const heading = document.createElement('h2');
            const categoryDetails = {
                ALT: { title: 'Atelier Altalen', socials: ['https://www.instagram.com/atelieraltalen/'] },
                CH: { title: 'Chiara + Haubergier', socials: ['https://www.instagram.com/vvvchiara/', 'https://www.instagram.com/haubergier_/'] },
                PS: { title: 'Psalm Studios', socials: ['https://www.instagram.com/psalmsstudios/'] },
                TQ: { title: 'Teresa Quadrani', socials: ['https://www.instagram.com/teresaquadrani/'] }
            };
            const details = categoryDetails[name];
            heading.textContent = details ? details.title : name;
            header.append(heading);

            if (details?.socials) {
                details.socials.forEach(social => {
                    const instagramLink = document.createElement('a');
                    instagramLink.href = social;
                    instagramLink.textContent = `@${new URL(social).pathname.split('/').filter(Boolean).pop()}`;
                    instagramLink.target = '_blank';
                    instagramLink.rel = 'noopener noreferrer';
                    header.append(instagramLink);
                });
            }

            section.append(header);

            const grid = document.createElement('div');
            grid.className = 'gallery-grid';
            const columns = Array.from({ length: 3 }, () => {
                const column = document.createElement('div');
                column.className = 'gallery-column';
                return column;
            });
            grid.append(...columns);
            const categoryImages = files.map(file => `img/fashion/${file}`);
            const items = [];

            files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.addEventListener('click', () => openLightbox(categoryImages, index));

                const thumbnail = document.createElement('img');
                thumbnail.src = `img/fashion/${file}`;
                thumbnail.alt = `${name} ${index + 1}`;
                thumbnail.loading = 'lazy';
                item.append(thumbnail);
                items.push(item);
            });

            galleryGrids.push({ columns, items });
            section.append(grid);
            document.querySelector('.gallery-container').append(section);
        });

        function layoutGalleryColumns() {
            const columnCount = window.matchMedia('(min-width: 768px)').matches ? 3 : 2;

            galleryGrids.forEach(({ columns, items }) => {
                columns.forEach((column, index) => {
                    column.hidden = index >= columnCount;
                    column.replaceChildren();
                });

                items.forEach((item, index) => {
                    columns[index % columnCount].append(item);
                });
            });
        }

        const desktopLayout = window.matchMedia('(min-width: 768px)');
        desktopLayout.addEventListener('change', layoutGalleryColumns);
        layoutGalleryColumns();

        function openLightbox(images, index) {
            currentImages = images;
            currentIndex = index;
            lightboxImg.src = currentImages[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + currentImages.length) % currentImages.length;
            lightboxImg.src = currentImages[currentIndex];
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') navigateLightbox(-1);
            if (event.key === 'ArrowRight') navigateLightbox(1);
        });

        lightbox.addEventListener('click', (event) => {
            if (event.target === lightboxImg) {
                const bounds = lightboxImg.getBoundingClientRect();
                const position = (event.clientX - bounds.left) / bounds.width;

                if (position < 1 / 3) {
                    navigateLightbox(-1);
                } else if (position > 2 / 3) {
                    navigateLightbox(1);
                } else {
                    closeLightbox();
                }
            } else if (event.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
    <footer class="site-footer">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
