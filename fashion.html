<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion | A R C P</title>
    <link rel="preload" href="fonts/eb-garamond-latin-400.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'EB Garamond';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('fonts/eb-garamond-latin-ext-400.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
        @font-face {
            font-family: 'EB Garamond';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('fonts/eb-garamond-latin-400.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'EB Garamond', serif;
            background: #f8f8f7;
            color: black;
        }
        a {
            color: #456b88;
        }
        a:hover {
            color: #36566d;
        }
        html {
            background-color: #f8f8f7;
        }
        .site-nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            padding: 1rem 0;
            background-color: #f8f8f7;
            isolation: isolate;
        }
        .nav-inner {
            display: grid;
            width: 90vw;
            margin: 0 auto;
            grid-template-columns: minmax(0, 1fr) auto;
            grid-template-areas:
                "title title"
                "links links";
            gap: 1rem;
        }
        .brand {
            display: block;
            grid-area: title;
            width: auto;
            color: #456b88;
            font-size: 1.25rem;
            line-height: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            text-align: left;
        }
        .nav-links {
            display: flex;
            grid-area: links;
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            letter-spacing: 0.1em;
            font-weight: 400;
        }
        .nav-links a {
            color: inherit;
            text-decoration: none;
            transition: color 0.15s ease-in-out;
        }
        .nav-links a[aria-current="page"] {
            text-decoration: underline;
        }
        .nav-links .nav-about-link {
            flex-basis: 100%;
            margin-left: 0;
            color: #a86464;
            text-align: left;
        }
        .brand:hover {
            color: #36566d;
        }
        .nav-links a:hover {
            color: #d1d5db;
        }
        .nav-links .nav-about-link:hover {
            color: #884747;
        }
        .site-footer {
            display: flex;
            position: fixed;
            right: 0;
            bottom: 0;
            left: 0;
            height: auto;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 0.5rem;
            background-color: #f8f8f7;
            color: #888888;
            font-size: 0.75rem;
            text-align: center;
        }
        .site-footer p {
            margin: 0;
        }
        .gallery-container {
            width: 100%;
        }
        .page-content {
            width: 90vw;
            min-height: 100vh;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        @media (min-width: 768px) {
            .nav-inner,
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
            .nav-inner {
                grid-template-areas:
                    "title title"
                    "links links";
            }
            .nav-links .nav-about-link {
                flex-basis: auto;
                margin-left: 0;
            }
        }
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f8f7;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }
        .gallery-category + .gallery-category {
            margin-top: 2rem;
        }
        .gallery-category-header {
            display: flex;
            align-items: baseline;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            line-height: 1.25rem;
            letter-spacing: 0.1em;
            font-weight: 400;
        }
        .gallery-category h2 {
            margin: 0;
            font: inherit;
        }
        .gallery-category-header a {
            text-decoration: none;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            align-items: start;
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .gallery-column {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 1rem;
        }
        .gallery-item {
            cursor: pointer;
            background-color: #f8f8f7;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #f8f8f7;
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html">Cyanotypes</a>
                <a href="fashion.html" aria-current="page">Fashion</a>
                <a href="portraits.html">Portraits</a>
                <a href="spaces.html">Spaces</a>
                <a href="about.html" class="nav-about-link">About</a>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="gallery-container">
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const categories = {
            ALT: ['alt-1.webp', 'alt-2.webp', 'alt-3.webp'],
            CH: ['ch-1.webp', 'ch-2.webp', 'ch-3.webp'],
            PS: ['ps-1.webp', 'ps-2.webp', 'ps-3.webp', 'ps-4.webp', 'ps-5.webp', 'ps-6.webp'],
            TQ: ['tq-a.webp', 'tq-b.webp', 'tq-c.webp', 'tq-1.webp', 'tq-2.webp', 'tq-3.webp', 'tq-4.webp', 'tq-5.webp', 'tq-6.webp']
        };
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const galleryGrids = [];
        let currentImages = [];
        let currentIndex = 0;

        Object.entries(categories).forEach(([name, files]) => {
            const section = document.createElement('section');
            section.className = 'gallery-category';

            const header = document.createElement('div');
            header.className = 'gallery-category-header';

            const heading = document.createElement('h2');
            const categoryDetails = {
                ALT: { title: 'Atelier Altalen', socials: ['https://www.instagram.com/atelieraltalen/'] },
                CH: { title: 'Chiara + Haubergier', socials: ['https://www.instagram.com/vvvchiara/', 'https://www.instagram.com/haubergier_/'] },
                PS: { title: 'Psalm Studios', socials: ['https://www.instagram.com/psalmsstudios/'] },
                TQ: { title: 'Teresa Quadrani', socials: ['https://www.instagram.com/teresaquadrani/'] }
            };
            const details = categoryDetails[name];
            heading.textContent = details ? details.title : name;
            header.append(heading);

            if (details?.socials) {
                details.socials.forEach(social => {
                    const instagramLink = document.createElement('a');
                    instagramLink.href = social;
                    instagramLink.textContent = `@${new URL(social).pathname.split('/').filter(Boolean).pop()}`;
                    instagramLink.target = '_blank';
                    instagramLink.rel = 'noopener noreferrer';
                    header.append(instagramLink);
                });
            }

            section.append(header);

            const grid = document.createElement('div');
            grid.className = 'gallery-grid';
            const columns = Array.from({ length: 3 }, () => {
                const column = document.createElement('div');
                column.className = 'gallery-column';
                return column;
            });
            grid.append(...columns);
            const categoryImages = files.map(file => `img/fashion/${file}`);
            const items = [];

            files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.addEventListener('click', () => openLightbox(categoryImages, index));

                const thumbnail = document.createElement('img');
                thumbnail.src = `img/fashion/${file}`;
                thumbnail.alt = `${name} ${index + 1}`;
                thumbnail.loading = 'lazy';
                item.append(thumbnail);
                items.push(item);
            });

            galleryGrids.push({ columns, items });
            section.append(grid);
            document.querySelector('.gallery-container').append(section);
        });

        function layoutGalleryColumns() {
            const columnCount = window.matchMedia('(min-width: 768px)').matches ? 3 : 2;

            galleryGrids.forEach(({ columns, items }) => {
                columns.forEach((column, index) => {
                    column.hidden = index >= columnCount;
                    column.replaceChildren();
                });

                items.forEach((item, index) => {
                    columns[index % columnCount].append(item);
                });
            });
        }

        const desktopLayout = window.matchMedia('(min-width: 768px)');
        desktopLayout.addEventListener('change', layoutGalleryColumns);
        layoutGalleryColumns();

        function openLightbox(images, index) {
            currentImages = images;
            currentIndex = index;
            lightboxImg.src = currentImages[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentIndex = (currentIndex + direction + currentImages.length) % currentImages.length;
            lightboxImg.src = currentImages[currentIndex];
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeLightbox();
            if (event.key === 'ArrowLeft') navigateLightbox(-1);
            if (event.key === 'ArrowRight') navigateLightbox(1);
        });

        lightbox.addEventListener('click', (event) => {
            if (event.target === lightboxImg) {
                const bounds = lightboxImg.getBoundingClientRect();
                const position = (event.clientX - bounds.left) / bounds.width;

                if (position < 1 / 3) {
                    navigateLightbox(-1);
                } else if (position > 2 / 3) {
                    navigateLightbox(1);
                } else {
                    closeLightbox();
                }
            } else if (event.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
    <footer class="site-footer">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
