<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Playfair Display', Georgia, serif;
        }
        html,
        body.bg-white {
            background-color: #fff;
        }
        .site-nav {
            position: fixed;
            inset: 0 0 auto;
            z-index: 50;
            padding: 1rem 0;
            background-color: #fff;
            isolation: isolate;
        }
        .nav-inner {
            display: flex;
            width: 90vw;
            max-width: none;
            margin-left: 5vw;
            margin-right: 5vw;
            align-items: stretch;
            flex-direction: column;
            gap: 1rem;
        }
        .nav-title {
            display: block;
            width: 100%;
            color: inherit;
            font-size: 1.25rem;
            line-height: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            text-align: left;
        }
        .nav-links {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
            font-size: 0.75rem;
            line-height: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-about {
            display: flex;
            width: 100%;
            justify-content: flex-start;
            gap: 0.75rem 1rem;
            font-size: 0.75rem;
            line-height: 1rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .nav-links a,
        .nav-about a {
            text-decoration: none;
        }
        .gallery-container {
            width: 100%;
        }
        .page-content {
            width: 90vw;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        @media (min-width: 768px) {
            .nav-inner,
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }
        .gallery-grid {
            column-count: 2;
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                column-count: 3;
            }
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            cursor: pointer;
            background-color: #fff;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #fff;
        }
    </style>
</head>
<body class="bg-white text-black">
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-title">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html" class="hover:text-gray-300 transition">Cyanotypes</a>
                <a href="fashion.html" class="hover:text-gray-300 transition">Fashion</a>
                <a href="portraits.html" class="hover:text-gray-300 transition" aria-current="page">Portraits</a>
                <a href="spaces.html" class="hover:text-gray-300 transition">Spaces</a>
            </div>
            <div class="nav-about"><a href="about.html" class="hover:text-gray-300 transition">About</a></div>
        </div>
    </nav>

    <!-- Gallery -->
    <div class="page-content min-h-screen">
        <div class="gallery-container">
            <div class="gallery-grid">
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const images = [
            'img/portraits/portrait-1.webp',
            'img/portraits/portrait-2.webp',
            'img/portraits/portrait-3.webp',
            'img/portraits/portrait-4.webp',
            'img/portraits/portrait-5.webp',
            'img/portraits/portrait-6.webp',
            'img/portraits/portrait-7.webp',
            'img/portraits/portrait-8.webp',
            'img/portraits/portrait-9.webp',
            'img/portraits/portrait-10.webp',
            'img/portraits/portrait-11.webp',
            'img/portraits/portrait-12.webp',
            'img/portraits/portrait-13.webp',
            'img/portraits/portrait-14.webp',
            'img/portraits/portrait-15.webp',
            'img/portraits/portrait-16.webp',
            'img/portraits/portrait-17.webp',
            'img/portraits/portrait-18.webp',
            'img/portraits/portrait-19.webp',
            'img/portraits/portrait-20.webp',
            'img/portraits/portrait-21.webp',
            'img/portraits/portrait-22.webp',
            'img/portraits/portrait-23.webp',
            'img/portraits/portrait-24.webp',
            'img/portraits/portrait-25.webp',
            'img/portraits/portrait-26.webp',
            'img/portraits/portrait-27.webp',
            'img/portraits/portrait-28.webp',
            'img/portraits/portrait-29.webp',
            'img/portraits/portrait-30.webp',
            'img/portraits/portrait-31.webp',
            'img/portraits/portrait-32.webp',
            'img/portraits/portrait-33.webp',
            'img/portraits/portrait-34.webp',
            'img/portraits/portrait-35.webp'
        ];

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        let currentIndex = 0;

        images.forEach((src, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.addEventListener('click', () => openLightbox(index));

            const thumbnail = document.createElement('img');
            thumbnail.src = src;
            thumbnail.alt = `Portrait ${index + 1}`;
            thumbnail.loading = 'lazy';
            item.append(thumbnail);

            document.querySelector('.gallery-grid').append(item);
        });

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            lightboxImg.src = images[currentIndex];
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Close on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightboxImg) {
                const bounds = lightboxImg.getBoundingClientRect();
                const position = (e.clientX - bounds.left) / bounds.width;

                if (position < 1 / 3) {
                    navigateLightbox(-1);
                } else if (position > 2 / 3) {
                    navigateLightbox(1);
                } else {
                    closeLightbox();
                }
            } else if (e.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
    <footer class="py-8 text-center text-sm text-gray-500">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
