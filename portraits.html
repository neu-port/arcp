<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portraits | arcp</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .gallery-container {
            width: 100%;
        }
        .page-content {
            width: 90vw;
            min-height: 100vh;
            margin-left: 5vw;
            margin-right: 5vw;
            padding: 10rem 0 5rem;
        }
        @media (min-width: 768px) {
            .page-content {
                width: 50vw;
                margin-left: 25vw;
                margin-right: 25vw;
            }
        }
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f8f7;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active {
            display: flex;
            opacity: 1;
        }
        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .lightbox.active img {
            opacity: 1;
            transform: scale(1);
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            column-gap: 1rem;
        }
        @media (min-width: 768px) {
            .gallery-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        .gallery-column {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 1rem;
        }
        .gallery-column[hidden] {
            display: none;
        }
        .gallery-item {
            cursor: pointer;
            background-color: #f8f8f7;
        }
        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            background-color: #f8f8f7;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="nav-inner">
            <a href="index.html" class="brand">Alberto Rafael Colombo Pastran</a>
            <div class="nav-links">
                <a href="cyanotypes.html">Cyanotypes</a>
                <a href="fashion.html">Fashion</a>
                <a href="portraits.html" aria-current="page">Portraits</a>
                <a href="spaces.html">Spaces</a>
                <a href="about.html" class="nav-about-link">About</a>
            </div>
        </div>
    </nav>

    <!-- Gallery -->
    <div class="page-content">
        <div class="gallery-container">
            <div class="gallery-grid">
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const imageCount = 40;
        const images = Array.from(
            { length: imageCount },
            (_, index) => `img/portraits/port-${imageCount - index}.webp`
        );

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const galleryGrid = document.querySelector('.gallery-grid');
        let currentIndex = 0;

        images.forEach((src, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.addEventListener('click', () => openLightbox(index));

            const thumbnail = document.createElement('img');
            thumbnail.src = src;
            thumbnail.alt = `Portrait ${src.match(/port-(\d+)/)[1]}`;
            thumbnail.loading = 'lazy';
            item.append(thumbnail);

            galleryGrid.append(item);
        });

        const galleryItems = [...galleryGrid.querySelectorAll('.gallery-item')];
        const galleryColumns = Array.from({ length: 3 }, () => {
            const column = document.createElement('div');
            column.className = 'gallery-column';
            return column;
        });
        galleryGrid.replaceChildren(...galleryColumns);

        function layoutGalleryColumns() {
            const columnCount = window.matchMedia('(min-width: 768px)').matches ? 3 : 2;
            const columnGap = parseFloat(getComputedStyle(galleryGrid).columnGap) || 0;
            const rowGap = parseFloat(getComputedStyle(galleryColumns[0]).rowGap) || 0;
            const columnWidth = (galleryGrid.clientWidth - columnGap * (columnCount - 1)) / columnCount;
            const columnHeights = Array(columnCount).fill(0);

            galleryColumns.forEach((column, index) => {
                column.hidden = index >= columnCount;
                column.replaceChildren();
            });

            galleryItems.forEach((item) => {
                const image = item.querySelector('img');
                const columnIndex = columnHeights.indexOf(Math.min(...columnHeights));
                const aspectRatio = image.naturalWidth && image.naturalHeight
                    ? image.naturalHeight / image.naturalWidth
                    : 1;

                galleryColumns[columnIndex].append(item);
                columnHeights[columnIndex] += columnWidth * aspectRatio + rowGap;
            });
        }

        galleryItems.forEach((item) => {
            item.querySelector('img').addEventListener('load', layoutGalleryColumns);
        });
        window.addEventListener('resize', layoutGalleryColumns);
        window.matchMedia('(min-width: 768px)').addEventListener('change', layoutGalleryColumns);
        layoutGalleryColumns();

        function openLightbox(index) {
            currentIndex = index;
            lightboxImg.src = images[currentIndex];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;
            lightboxImg.src = images[currentIndex];
        }

        // Close on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Close on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightboxImg) {
                const bounds = lightboxImg.getBoundingClientRect();
                const position = (e.clientX - bounds.left) / bounds.width;

                if (position < 1 / 3) {
                    navigateLightbox(-1);
                } else if (position > 2 / 3) {
                    navigateLightbox(1);
                } else {
                    closeLightbox();
                }
            } else if (e.target === lightbox) {
                closeLightbox();
            }
        });
    </script>
    <footer class="site-footer">
        <p>&copy; 2020-2026 Alberto Rafael Colombo Pastran. All rights reserved.</p>
    </footer>
</body>
</html>
